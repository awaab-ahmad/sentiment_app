name: Sentiment App 

on: 
  push: 
  pull_request:

jobs:
  Analyzing:
    runs-on: ubuntu-latest

    steps:
      - name: Set Up the Engine
        uses: actions/checkout@v4

      - name: Set up the flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cahce: True

      - name: Running dart formatter
        run: dart format --set-exit-if-changed .

  build: 
    runs-on: ubuntu-latest
    needs: Analyzing

    steps: 
      - name: Setting up engine
        uses: actions/checkout@v4

      - name: Setting flutter SDK
        uses: subusito/flutter-action@v2
        with: 
          channel: stable

      - name: Doing Flutter
        run: flutter clean

      - name: Doing flutter pub get
        run: flutter pub get

      - name: Building the application
        run: flutter build apk --split-per-abi

      - name: Uploading the File to artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: Sentiments Releases
          path: build/app/outputs/flutter-apk


  
