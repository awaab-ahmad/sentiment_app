name: sentiment_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.1.2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_riverpod: ^3.4.2
  intl: ^0.20.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  material_ui: ^1.11.1


flutter_native_splash: 
  color: "#FBF6EF"
  color_dark: "#1C1A17"

  image: assets/images/app_logo_main.png
  image_dark: assets/images/app_logo_main.png

  android_12: 
    color: "#FBF6EF"
    color_dark: "#1C1A17"
    image: assets/images/app_logo_main.png
    image_dark: assets/images/app_logo_main.png

flutter_launcher_icons:
  android: "launcher_icons"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_logo_main.png"
  min_sdk_android: 21 

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/app_logo.png
    - assets/images/equalizer.png
    - assets/images/smile.png
    - assets/images/sad.png
    - assets/images/neutral.png
    - assets/images/sparkler.png
    - assets/images/splash_logo.png
    - assets/images/app_logo_main.png


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Black.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 600      
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 700      
        - asset: assets/fonts/Poppins-Medium.ttf      
        - asset: assets/fonts/Poppins-Regular.ttf      
        - asset: assets/fonts/Poppins-SemiBold.ttf      
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
